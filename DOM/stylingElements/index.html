<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="product">
        <h2>Wireless headphones</h2>
        <p id="price">₹3,499</p>
        <p id="card-total" style="color: red; font-size: 16px;">Total: ₹8,500</p>
        <p id="stock-status" style="color: orange;">Low Stock</p>

        <style>
            #inventory-count {
                color: blue;
            }
        </style>

        <p id="inventory-count">12 items remaining</p>

        <style>
            .product-price {
                color: blue;
            }
        </style>

        <p id="price" class="product-price">₹4,999</p>
    </div>
    <p>--------------------------------------------------------------------------------</p>

    <div id="inventory">
        <p class="item">Laptop</p>
        <p class="item">Keyboard</p>
        <p class="item">Mouse</p>
    </div>

    <script src="index.js"></script>
</body>

</html>
